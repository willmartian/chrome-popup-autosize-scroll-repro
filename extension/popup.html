<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; width: 380px; height: 600px; }
      /* The page is sized from the viewport (100vw / 100vh), as many popup UIs are. */
      #root { width: 100vw; height: 100vh; }
      #scroller { position: relative; height: 100%; overflow-y: auto; font: 14px system-ui; }
      #spacer { position: relative; }
      .row { position: absolute; left: 0; right: 0; height: 59px; border-bottom: 1px solid #ddd; padding: 8px 12px; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <div id="root"><div id="scroller"><div id="spacer"></div></div></div>
    <script src="popup.js"></script>
  </body>
</html>
